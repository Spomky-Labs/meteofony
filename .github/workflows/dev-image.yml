name: 🐋 Dev image

# The image `castor start` pulls: ghcr.io/spomky-labs/meteofony:dev, the frankenphp_dev target of the
# Dockerfile, for amd64 and arm64 (IMAGES_PREFIX in .env points compose at it). A fresh clone then skips
# compiling FrankenPHP with xcaddy, which is the longest step of the setup.
#
# It lives apart from ci.yml so that a red quality job does not hold the image back, and each architecture
# builds on a GitHub-hosted runner of its own: compiling FrankenPHP under QEMU takes the better part of
# an hour.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - frankenphp/**
      - .github/workflows/dev-image.yml
  workflow_dispatch: ~

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/spomky-labs/meteofony

jobs:
  build:
    name: "🐳 Build (${{ matrix.arch }})"
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: frankenphp_dev
          platforms: linux/${{ matrix.arch }}
          push: true
          # Without it each tag is already an index carrying an attestation, and the manifest below
          # merges those into an `unknown/unknown` platform next to the two real ones.
          provenance: false
          tags: ${{ env.IMAGE }}:dev-${{ matrix.arch }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=dev-${{ matrix.arch }}
          cache-to: type=gha,scope=dev-${{ matrix.arch }},mode=max

  manifest:
    name: "📦 Manifest"
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-arch dev tag
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:dev" \
            --tag "$IMAGE:dev-${GITHUB_SHA::7}" \
            "$IMAGE:dev-amd64" \
            "$IMAGE:dev-arm64"
          docker buildx imagetools inspect "$IMAGE:dev"
