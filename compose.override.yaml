# Development environment override
services:
  php:
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      - ./frankenphp/certs:/etc/caddy/certs:ro
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      CADDY_GLOBAL_OPTIONS: "debug"
      MAILER_DSN: smtp://mailer:1025
#      CADDY_SERVER_EXTRA_DIRECTIVES: |
#        tls /etc/caddy/certs/tls.pem /etc/caddy/certs/tls.key {
#          protocols tls1.3
#          ca_root /etc/caddy/certs/ca.pem
#        }
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # `oidc_login` refuses an announced endpoint on plain HTTP outside a loopback host, and the
      # backchannel one is `keycloak`
      KC_HTTPS_CERTIFICATE_FILE: /etc/keycloak/certs/keycloak.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/keycloak/certs/keycloak.key
      KC_HOSTNAME: https://localhost:${KEYCLOAK_PORT:-8444}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./frankenphp/certs/keycloak.pem:/etc/keycloak/certs/keycloak.pem:ro
      - ./frankenphp/certs/keycloak.key:/etc/keycloak/certs/keycloak.key:ro
      - ./keycloak/meteofony-realm.json:/opt/keycloak/data/import/meteofony-realm.json:ro
    ports:
      - target: 8443
        published: ${KEYCLOAK_PORT:-8444}
        protocol: tcp

volumes:
  aws:
