# Production environment override
services:
  php:
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET}
      # Selects the FrankenPHP worker runner that symfony/runtime 8 now carries, in place of the
      # APP_RUNTIME of runtime/frankenphp-symfony. FRANKENPHP_CONFIG below puts Caddy in worker
      # mode, so this file needs the variable too and not only worker.Caddyfile.
      FRANKENPHP_WORKER: "1"
      FRANKENPHP_CONFIG: "worker ./public/index.php"
      CADDY_GLOBAL_OPTIONS: "order coraza_waf first"
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        coraza_waf {
        load_owasp_crs
        directives `
        Include @coraza.conf-recommended
        Include @crs-setup.conf.example
        Include @owasp_crs/*.conf
        # Bypass WAF for /csp/report POST requests
        SecRule REQUEST_URI "@beginsWith /csp/report" "id:1000001,phase:1,pass,nolog,ctl:ruleEngine=Off"
        SecRule REQUEST_URI "@beginsWith /csp/report" "id:1000002,phase:2,pass,nolog,ctl:ruleEngine=Off"
        SecRuleEngine On
        `
        }
        handle_errors 403 {
        header X-Blocked "true"
        root * /etc/caddy/custom-pages
        rewrite * /{err.status_code}.html
        file_server
        templates
        }
