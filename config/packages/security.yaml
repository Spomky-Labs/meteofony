security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            id: App\Security\UserProvider
        oidc_users:
            id: Symfony\Component\Security\Core\User\OidcUserProvider
#        app_admin_provider:
#            id: App\Security\AdminProvider


    role_hierarchy:
        ROLE_ADMIN:           ROLE_USER

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: oidc_users
            access_token:
                token_handler:
                    oauth2:
                        http_client: keycloak.introspection
                        issuer: '%env(OIDC_PROVIDER_URI)%'
                        audience: 'meteofony-api'
                realm: 'Meteofony API'

        main:
            pattern: ^/
            lazy: true
            provider: app_user_provider

            custom_authenticator: App\Security\UsernamePasswordAuthenticator
            entry_point: App\Security\UsernamePasswordAuthenticator
            oidc_login:
                provider: oidc_users
                provider_uri: '%env(OIDC_PROVIDER_URI)%'
                # the issuer above is what the browser reaches; the container reads the document here
                discovery_uri: '%env(OIDC_DISCOVERY_URI)%'
                http_client: keycloak.client
                client_id: '%env(OIDC_CLIENT_ID)%'
                client_authentication:
                    client_secret_basic: '%env(OIDC_CLIENT_SECRET)%'
                scope: ['openid', 'profile', 'email']
                check_path: /oidc/callback
            logout:
                path: /logout
                # where to redirect after logout
                target: app_homepage
            
#            webauthn:
#                authentication:
#                    routes:
#                        options_path: '/assertion/options'
#                        result_path: '/assertion/result'
#            x509:
#                provider: app_admin_provider
#                user_identifier: CN
            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
